<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Headquarters — Not Forgotten Systems</title>
<meta name="version" content="2026-08-06-1915">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0b2c4d; --navy-rgb: 11,44,77;
    --gold: #e0a62a; --gold-rgb: 224,166,42;
    --white: #ffffff; --light: #f7fbff; --muted: #6b7280;
    --text: #0a0a0a; --surface: #ffffff;
    --border: rgba(0,0,0,0.06);
    --healthy: #16a34a; --caution: #d97706; --critical: #dc2626;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --text-xs: 12px; --text-sm: 14px; --text-base: 16px;
    --text-lg: 20px; --text-xl: 24px; --text-2xl: 32px;
    --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
    --space-xs: 4px; --space-sm: 8px; --space-md: 16px;
    --space-lg: 24px; --space-xl: 32px; --space-2xl: 48px;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
    --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
  }
  body { font-family: var(--font); background: var(--light); color: var(--text); font-size: var(--text-base); line-height: 1.6; -webkit-font-smoothing: antialiased; }

  /* ── Header ── */
  .header { background: var(--navy); padding: var(--space-md) var(--space-xl); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header-left { display: flex; align-items: center; gap: var(--space-md); }
  .header-logo { height: 24px; width: auto; }
  .header h1 { color: var(--white); font-size: var(--text-lg); font-weight: 600; letter-spacing: -0.01em; }
  .header-right { display: flex; align-items: center; gap: var(--space-lg); }
  .header-score { display: flex; align-items: center; gap: var(--space-sm); background: rgba(255,255,255,0.08); padding: 6px 14px; border-radius: 20px; }
  .header-score .score-num { color: var(--gold); font-size: var(--text-lg); font-weight: 700; }
  .header-score .score-change { font-size: var(--text-xs); font-weight: 600; }
  .score-up { color: #4ade80; } .score-down { color: #f87171; } .score-flat { color: rgba(255,255,255,0.4); }
  .header-updated { color: rgba(255,255,255,0.4); font-size: var(--text-xs); }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,0.4); flex-shrink: 0; }
  .pulse.offline { background: #ef4444; box-shadow: 0 0 6px rgba(239,68,68,0.3); }

  /* ── Layout ── */
  .container { max-width: 900px; margin: 0 auto; padding: var(--space-xl) var(--space-lg); }

  /* ── Section ── */
  .section { margin-bottom: var(--space-2xl); }
  .section-header { display: flex; align-items: center; gap: var(--space-sm); margin-bottom: var(--space-md); }
  .section-header h2 { font-size: var(--text-sm); font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .section-header .line { flex: 1; height: 1px; background: var(--border); }

  /* ── Atlas's Brief ── */
  .brief-card { background: var(--surface); border-radius: var(--radius-lg); padding: var(--space-xl); box-shadow: var(--shadow-sm); border: 1px solid var(--border); border-left: 3px solid var(--navy); }
  .brief-greeting { font-size: var(--text-lg); font-weight: 700; color: var(--navy); margin-bottom: var(--space-sm); }
  .brief-body { font-size: var(--text-base); color: var(--text); line-height: 1.8; }
  .brief-footer { margin-top: var(--space-md); padding-top: var(--space-md); border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: var(--text-xs); color: var(--muted); }
  .brief-time { display: flex; align-items: center; gap: var(--space-xs); }

  /* ── Business Health ── */
  .health-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-md); }
  @media (max-width: 700px) { .health-grid { grid-template-columns: repeat(2, 1fr); } }
  .health-card { background: var(--surface); border-radius: var(--radius-md); padding: var(--space-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--border); display: flex; align-items: flex-start; gap: var(--space-md); }
  .health-icon { font-size: 24px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); background: var(--light); flex-shrink: 0; }
  .health-body { flex: 1; min-width: 0; }
  .health-body .health-name { font-weight: 600; font-size: var(--text-sm); color: var(--navy); display: flex; align-items: center; gap: var(--space-sm); }
  .health-body .health-detail { font-size: var(--text-xs); color: var(--muted); margin-top: 2px; line-height: 1.4; }
  .health-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-healthy { background: var(--healthy); box-shadow: 0 0 6px rgba(22,163,74,0.3); }
  .dot-caution { background: var(--caution); box-shadow: 0 0 6px rgba(217,119,6,0.3); }
  .dot-critical { background: var(--critical); box-shadow: 0 0 6px rgba(220,38,38,0.3); }

  /* ── Waiting For James ── */
  .waiting-list { display: flex; flex-direction: column; gap: var(--space-sm); }
  .waiting-item { background: var(--surface); border-radius: var(--radius-md); padding: var(--space-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--border); transition: box-shadow 0.15s; }
  .waiting-item:hover { box-shadow: var(--shadow-md); }
  .waiting-item.high-impact { border-left: 3px solid var(--gold); }
  .waiting-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-md); margin-bottom: var(--space-sm); }
  .waiting-top h3 { font-size: var(--text-base); font-weight: 600; color: var(--navy); }
  .waiting-impact { font-size: var(--text-xs); font-weight: 600; padding: 2px 10px; border-radius: 12px; white-space: nowrap; }
  .impact-high { background: rgba(224,166,42,0.12); color: #b8860b; }
  .impact-medium { background: rgba(107,114,128,0.1); color: var(--muted); }
  .impact-low { background: rgba(107,114,128,0.05); color: var(--muted); }
  .waiting-meta { display: flex; gap: var(--space-lg); font-size: var(--text-xs); color: var(--muted); margin-top: var(--space-sm); flex-wrap: wrap; }
  .waiting-recommendation { margin-top: var(--space-sm); font-size: var(--text-sm); color: var(--text); padding: var(--space-sm) var(--space-md); background: var(--light); border-radius: var(--radius-sm); }

  /* ── Atlas's Recommendation ── */
  .rec-card { background: var(--surface); border-radius: var(--radius-lg); padding: var(--space-xl); box-shadow: var(--shadow-sm); border: 1px solid var(--border); border-left: 3px solid var(--gold); }
  .rec-summary { font-size: var(--text-base); line-height: 1.7; margin-bottom: var(--space-xl); color: var(--text); }
  .rec-priority { margin-bottom: var(--space-lg); padding-bottom: var(--space-lg); border-bottom: 1px solid var(--border); }
  .rec-priority:last-of-type { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  .rec-priority .rec-num { font-size: var(--text-xs); font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: var(--space-xs); }
  .rec-priority h3 { font-size: var(--text-base); font-weight: 600; color: var(--navy); margin-bottom: var(--space-sm); }
  .rec-priority p { font-size: var(--text-sm); color: var(--text); line-height: 1.6; margin-bottom: var(--space-sm); }
  .rec-meta { display: flex; gap: var(--space-xl); font-size: var(--text-xs); color: var(--muted); flex-wrap: wrap; }
  .rec-meta span { display: flex; align-items: center; gap: var(--space-xs); }
  .rec-confidence { font-weight: 600; }
  .conf-high { color: var(--healthy); } .conf-medium { color: var(--caution); } .conf-low { color: var(--critical); }
  .can-wait { margin-top: var(--space-xl); padding-top: var(--space-lg); border-top: 1px solid var(--border); }
  .can-wait h4 { font-size: var(--text-sm); font-weight: 600; color: var(--muted); margin-bottom: var(--space-sm); }
  .can-wait ul { list-style: none; padding: 0; }
  .can-wait li { font-size: var(--text-sm); color: var(--muted); padding: var(--space-xs) 0; padding-left: var(--space-lg); position: relative; }
  .can-wait li::before { content: '—'; position: absolute; left: 0; color: var(--muted); }
  .rec-closing { margin-top: var(--space-lg); font-size: var(--text-sm); color: var(--muted); font-style: italic; }

  /* ── What Changed ── */
  .changes-tabs { display: flex; gap: var(--space-xs); margin-bottom: var(--space-md); }
  .changes-tab { font-size: var(--text-xs); font-weight: 600; padding: 6px 16px; border-radius: 20px; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--muted); transition: all 0.15s; }
  .changes-tab.active { background: var(--navy); color: var(--white); border-color: var(--navy); }
  .changes-list { display: flex; flex-direction: column; }
  .change-item { display: flex; gap: var(--space-md); padding: var(--space-sm) 0; font-size: var(--text-sm); border-bottom: 1px solid var(--border); }
  .change-item:last-child { border-bottom: none; }
  .change-time { color: var(--muted); font-size: var(--text-xs); min-width: 80px; flex-shrink: 0; }
  .change-desc { flex: 1; }

  /* ── Empty states ── */
  .empty-state { text-align: center; padding: var(--space-xl); color: var(--muted); font-size: var(--text-sm); }

  /* ── Secondary nav ── */
  .secondary-links { display: flex; gap: var(--space-md); flex-wrap: wrap; margin-top: var(--space-xl); padding-top: var(--space-xl); border-top: 1px solid var(--border); }
  .secondary-links a { color: var(--muted); text-decoration: none; font-size: var(--text-sm); padding: var(--space-xs) var(--space-sm); border-radius: var(--radius-sm); transition: all 0.15s; }
  .secondary-links a:hover { color: var(--navy); background: rgba(11,44,77,0.04); }

  /* ── Loading ── */
  .loading { text-align: center; padding: var(--space-3xl); color: var(--muted); }
  .loading-spinner { display: inline-block; width: 24px; height: 24px; border: 2px solid var(--border); border-top: 2px solid var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: var(--space-md); }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- ── Header ── -->
<div class="header">
  <div class="header-left">
    <img src="../assets/favicon.png" alt="NF" class="header-logo">
    <h1>Headquarters</h1>
  </div>
  <div class="header-right">
    <div class="header-score" id="score-badge">
      <span class="score-num" id="score-num">—</span>
      <span class="score-change" id="score-change"></span>
    </div>
    <span class="pulse" id="pulse"></span>
    <span class="header-updated" id="updated">Loading…</span>
  </div>
</div>

<div class="container" id="app">
  <div class="loading">
    <div class="loading-spinner"></div>
    <div>Loading Headquarters…</div>
  </div>
</div>

<!-- ── Script ── -->
<script>
let H = null;  // headquarters data
let D = null;  // raw dash data

async function load() {
  try {
    const [hr, dr] = await Promise.all([
      fetch('headquarters-data.json?' + Date.now()),
      fetch('dash.json?' + Date.now())
    ]);
    H = await hr.json();
    D = await dr.json();
  } catch(e) {
    H = null; D = null;
  }
  render();
}

function ago(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const now = new Date();
  const min = Math.floor((now - d) / 60000);
  if (min < 1) return 'just now';
  if (min < 60) return min + 'm ago';
  const hrs = Math.floor(min / 60);
  if (hrs < 24) return hrs + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function healthDot(status) {
  const cls = status === 'healthy' ? 'dot-healthy' : status === 'caution' ? 'dot-caution' : 'dot-critical';
  return '<span class="health-dot ' + cls + '"></span>';
}

function statusLabel(status) {
  if (status === 'healthy') return 'Healthy';
  if (status === 'caution') return 'Needs attention';
  return 'Critical';
}

function render() {
  const app = document.getElementById('app');

  if (!H && !D) {
    app.innerHTML = '<div class="empty-state">Unable to load Headquarters data. Check back shortly.</div>';
    return;
  }

  // ── Header ──
  const agentUp = D?.health?.agent === 'online';
  document.getElementById('pulse').className = 'pulse' + (agentUp ? '' : ' offline');
  document.getElementById('updated').textContent = 'Updated ' + ago(H?.generated_at || D?.last_updated);

  // Business Score
  const score = H?.business_score;
  if (score) {
    document.getElementById('score-num').textContent = score.score + '/100';
    const ch = score.change || 0;
    const changeEl = document.getElementById('score-change');
    if (ch > 0) { changeEl.textContent = '+' + ch; changeEl.className = 'score-change score-up'; }
    else if (ch < 0) { changeEl.textContent = ch; changeEl.className = 'score-change score-down'; }
    else { changeEl.textContent = '—'; changeEl.className = 'score-change score-flat'; }
  }

  let html = '';

  // ═══════════════════════════════════════
  // 1. ATLAS'S BRIEF
  // ═══════════════════════════════════════
  const brief = H?.atlas_brief;
  if (brief) {
    html += '<div class="section">';
    html += '<div class="section-header"><h2>Atlas\'s Brief</h2><span class="line"></span></div>';
    html += '<div class="brief-card">';
    html += '<div class="brief-greeting">' + esc(brief.greeting) + '</div>';
    html += '<div class="brief-body">' + esc(brief.body) + '</div>';
    html += '<div class="brief-footer">';
    html += '<span>Est. reading time: 30 seconds</span>';
    html += '<span class="brief-time">⏱ Review time: ' + esc(brief.estimated_time || '—') + '</span>';
    html += '</div></div></div>';
  }

  // ═══════════════════════════════════════
  // 2. BUSINESS HEALTH
  // ═══════════════════════════════════════
  const health = H?.business_health;
  if (health) {
    html += '<div class="section">';
    html += '<div class="section-header"><h2>Business Health</h2><span class="line"></span></div>';
    html += '<div class="health-grid">';
    for (const [key, h] of Object.entries(health)) {
      const name = key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      html += '<div class="health-card">';
      html += '<div class="health-icon">' + (h.icon || '📊') + '</div>';
      html += '<div class="health-body">';
      html += '<div class="health-name">' + healthDot(h.status) + ' ' + name + '</div>';
      html += '<div class="health-detail">' + esc(h.detail || '') + '</div>';
      html += '</div></div>';
    }
    html += '</div></div>';
  }

  // ═══════════════════════════════════════
  // 3. WAITING FOR JAMES
  // ═══════════════════════════════════════
  const waiting = H?.waiting_for_james;
  if (waiting && waiting.length > 0) {
    // Sort by impact_sort descending
    const sorted = [...waiting].sort((a, b) => (b.impact_sort || 0) - (a.impact_sort || 0));
    html += '<div class="section">';
    html += '<div class="section-header"><h2>Waiting For James</h2><span class="line"></span></div>';
    html += '<div class="waiting-list">';
    sorted.forEach(w => {
      const impactClass = w.impact_sort >= 80 ? 'high-impact' : '';
      const impactLabel = w.impact_sort >= 80 ? 'High' : w.impact_sort >= 50 ? 'Medium' : 'Low';
      const impactTagClass = w.impact_sort >= 80 ? 'impact-high' : w.impact_sort >= 50 ? 'impact-medium' : 'impact-low';
      html += '<div class="waiting-item ' + impactClass + '">';
      html += '<div class="waiting-top">';
      html += '<h3>' + esc(w.title) + '</h3>';
      html += '<span class="waiting-impact ' + impactTagClass + '">' + impactLabel + ' impact</span>';
      html += '</div>';
      html += '<div style="font-size:var(--text-sm);color:var(--text);line-height:1.5;">' + esc(w.why_it_matters) + '</div>';
      html += '<div class="waiting-meta">';
      html += '<span>📊 ' + esc(w.business_impact) + '</span>';
      html += '<span>⏱ ' + esc(w.estimated_time) + '</span>';
      html += '</div>';
      html += '<div class="waiting-recommendation">💡 <strong>Recommended:</strong> ' + esc(w.recommended_action) + '</div>';
      html += '</div>';
    });
    html += '</div></div>';
  }

  // ═══════════════════════════════════════
  // 4. ATLAS'S RECOMMENDATION
  // ═══════════════════════════════════════
  const rec = H?.atlas_recommendation;
  if (rec) {
    html += '<div class="section">';
    html += '<div class="section-header"><h2>🎯 Atlas\'s Recommendation</h2><span class="line"></span></div>';
    html += '<div class="rec-card">';
    html += '<div class="rec-summary">' + esc(rec.executive_summary) + '</div>';

    const priorities = rec.priorities || [];
    priorities.forEach((p, i) => {
      html += '<div class="rec-priority">';
      html += '<div class="rec-num">Priority ' + (i + 1) + '</div>';
      html += '<h3>' + esc(p.action) + '</h3>';
      html += '<p>' + esc(p.why_it_matters) + '</p>';
      html += '<p style="color:var(--muted);">' + esc(p.expected_impact) + '</p>';
      html += '<div class="rec-meta">';
      html += '<span>⏱ ' + esc(p.estimated_time) + '</span>';
      const confClass = (p.confidence || '').toLowerCase().includes('high') ? 'conf-high' : (p.confidence || '').toLowerCase().includes('medium') ? 'conf-medium' : 'conf-low';
      html += '<span class="rec-confidence ' + confClass + '">🎯 Confidence: ' + esc(p.confidence || '—') + '</span>';
      html += '</div></div>';
    });

    // Things That Can Wait
    const canWait = rec.can_wait || [];
    if (canWait.length > 0) {
      html += '<div class="can-wait">';
      html += '<h4>Things That Can Wait</h4>';
      html += '<ul>';
      canWait.forEach(cw => { html += '<li>' + esc(cw) + '</li>'; });
      html += '</ul></div>';
    }

    if (rec.closing) {
      html += '<div class="rec-closing">' + esc(rec.closing) + '</div>';
    }
    html += '</div></div>';
  }

  // ═══════════════════════════════════════
  // 5. WHAT CHANGED
  // ═══════════════════════════════════════
  const changes = H?.changes;
  if (changes) {
    html += '<div class="section">';
    html += '<div class="section-header"><h2>What Changed</h2><span class="line"></span></div>';
    html += '<div class="changes-tabs">';
    html += '<span class="changes-tab active" onclick="showChanges(\'today\')">Today</span>';
    html += '<span class="changes-tab" onclick="showChanges(\'yesterday\')">Yesterday</span>';
    html += '<span class="changes-tab" onclick="showChanges(\'this_week\')">This Week</span>';
    html += '</div>';

    // All change groups as hidden divs
    for (const [key, items] of Object.entries(changes)) {
      const display = key === 'today' ? 'block' : 'none';
      html += '<div class="changes-list" id="changes-' + key + '" style="display:' + display + ';">';
      if (items && items.length > 0) {
        items.forEach(c => {
          html += '<div class="change-item">';
          if (typeof c === 'string') {
            html += '<span class="change-time"></span>';
            html += '<span class="change-desc">' + esc(c) + '</span>';
          } else {
            html += '<span class="change-time">' + esc(c.time || c.day || '') + '</span>';
            html += '<span class="change-desc">' + esc(c.text || c.description || '') + '</span>';
          }
          html += '</div>';
        });
      } else {
        html += '<div class="empty-state" style="text-align:left;padding:var(--space-md);">No changes for this period.</div>';
      }
      html += '</div>';
    }
    html += '</div>';
  }

  // ═══════════════════════════════════════
  // 6. LESSONS LEARNED
  // ═══════════════════════════════════════
  const lessons = H?.lessons_learned;
  if (lessons && lessons.total > 0) {
    html += '<div class="section">';
    html += '<div class="section-header"><h2>Lessons Learned</h2><span class="line"></span><span style="font-size:var(--text-xs);color:var(--muted);">' + lessons.total + ' total</span></div>';
    const recent = lessons.recent || [];
    recent.forEach(ll => {
      html += '<div class="waiting-item" style="margin-bottom:var(--space-sm);">';
      html += '<div class="waiting-top">';
      html += '<h3 style="font-size:var(--text-sm);">' + esc(ll.id) + ' — ' + esc(ll.title) + '</h3>';
      html += '<span class="waiting-impact impact-medium" style="font-size:10px;">' + esc(ll.status) + '</span>';
      html += '</div>';
      html += '<div style="font-size:var(--text-xs);color:var(--muted);line-height:1.5;">' + esc(ll.summary) + '</div>';
      html += '</div>';
    });
    html += '</div>';
  }

  // ═══════════════════════════════════════
  // 7. QPAINT PIPELINE
  // ═══════════════════════════════════════
  const qp = H?.qpaint_pipeline;
  if (qp) {
    const s = qp.summary;
    html += '<div class="section">';
    html += '<div class="section-header"><h2>QPaint Recovery</h2><span class="line"></span><span style="font-size:var(--text-xs);color:var(--muted);">' + s.total_customers + ' customers | ' + s.total_pipeline_value + '</span></div>';
    html += '<div class="health-grid" style="grid-template-columns: repeat(4, 1fr);">';
    html += '<div class="health-card"><span class="dot green"></span><strong>Won</strong><br>' + s.won_count + ' (' + s.won_value + ')</div>';
    html += '<div class="health-card"><span class="dot green"></span><strong>Engaged/Replied</strong><br>' + s.engaged_replied + '</div>';
    html += '<div class="health-card"><span class="dot amber"></span><strong>Contacted</strong><br>' + s.contacted + '</div>';
    html += '<div class="health-card"><span class="dot red"></span><strong>Lost</strong><br>' + s.lost_count + '</div>';
    html += '</div>';

    // Priority
    html += '<div style="display:flex;gap:var(--space-sm);margin-top:var(--space-sm);font-size:var(--text-xs);color:var(--muted);">';
    html += '<span>P1: ' + (qp.priority?.P1 || 0) + '</span>';
    html += '<span>P2: ' + (qp.priority?.P2 || 0) + '</span>';
    html += '<span>P3: ' + (qp.priority?.P3 || 0) + '</span>';
    html += '</div>';

    // Key customers
    const kc = qp.key_customers;
    if (kc && kc.length > 0) {
      html += '<div style="margin-top:var(--space-md);">';
      kc.forEach(c => {
        const dotColor = c.stage === 'Won' ? 'green' : c.stage === 'Lost' ? 'red' : 'amber';
        html += '<div class="waiting-item" style="margin-bottom:var(--space-xs);">';
        html += '<div class="waiting-top">';
        html += '<h3 style="font-size:var(--text-sm);">' + esc(c.name) + ' — ' + esc(c.value) + '</h3>';
        html += '<span class="waiting-impact impact-medium" style="font-size:10px;">' + esc(c.stage) + '</span>';
        html += '</div>';
        html += '<div style="font-size:var(--text-xs);color:var(--muted);">' + esc(c.status) + '</div>';
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
  }

  // ═══════════════════════════════════════
  // 8. VAULT HEALTH
  // ═══════════════════════════════════════
  const vh = H?.vault_health;
  if (vh) {
    html += '<div class="section">';
    html += '<div class="section-header"><h2>Vault Health</h2><span class="line"></span><span style="font-size:var(--text-xs);color:var(--muted);">Institutional memory</span></div>';
    html += '<div class="health-grid" style="grid-template-columns: repeat(4, 1fr);">';
    html += '<div class="health-card"><span class="dot green"></span><strong>Decisions</strong><br>' + vh.decisions.total + ' (' + vh.decisions.founding + ' founding)</div>';
    html += '<div class="health-card"><span class="dot green"></span><strong>Learnings</strong><br>' + vh.learnings.total + ' (' + vh.learnings.resolved + ' resolved)</div>';
    html += '<div class="health-card"><span class="dot green"></span><strong>Incidents</strong><br>' + vh.incidents.total + ' (' + vh.incidents.resolved + ' resolved)</div>';
    html += '<div class="health-card"><span class="dot green"></span><strong>CEO Briefs</strong><br>' + vh.ceo_briefs.published + ' published</div>';
    html += '</div>';
    html += '<div style="display:flex;gap:var(--space-sm);margin-top:var(--space-sm);font-size:var(--text-xs);color:var(--muted);">';
    html += '<span>BK: ' + vh.business_knowledge.principles + ' principles</span>';
    html += '<span>Memory: ' + vh.memory.usage + '</span>';
    html += '<span>Disk: ' + vh.infrastructure.disk + '</span>';
    html += '</div>';
    html += '</div>';
  }

  // ═══════════════════════════════════════
  // FOOTER
  // ═══════════════════════════════════════
  html += '<div class="secondary-links">';
  html += '<span style="font-size:var(--text-xs);color:var(--muted);margin-right:var(--space-md);">More →</span>';
  html += '<a href="decision-board/">Founder Decision Board</a>';
  html += '<a href="audit/">Full Operational Audit</a>';
  html += '<a href="../ceo-brief/">CEO Brief</a>';
  html += '<a href="followup/">Follow-Up Queue</a>';
  html += '<a href="qpaint-recovery/">QPaint Recovery</a>';
  html += '<a href="../vault-lint/">Vault Health</a>';
  html += '<a href="brain/">System</a>';
  html += '<a href="calendar/">Calendar</a>';
  html += '</div>';

  app.innerHTML = html;
}

function showChanges(key) {
  // Update tabs
  document.querySelectorAll('.changes-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.changes-tab').forEach(t => {
    if (t.textContent.toLowerCase().replace(' ', '_') === key || 
        (key === 'this_week' && t.textContent === 'This Week')) {
      t.classList.add('active');
    }
  });
  // Fallback: find by onclick
  const tabs = document.querySelectorAll('.changes-tab');
  const map = {'today': 0, 'yesterday': 1, 'this_week': 2};
  if (map[key] !== undefined && tabs[map[key]]) tabs[map[key]].classList.add('active');

  // Show/hide change lists
  ['today', 'yesterday', 'this_week'].forEach(k => {
    const el = document.getElementById('changes-' + k);
    if (el) el.style.display = k === key ? 'block' : 'none';
  });
}

function esc(s) {
  if (!s) return '';
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// Boot
load();
// Refresh every 5 minutes
setInterval(load, 300000);
</script>
