<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Headquarters — Not Forgotten Systems</title>
<meta name="version" content="2026-09-02-founder-outreach">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0b2c4d; --navy-rgb: 11,44,77;
    --gold: #e0a62a; --gold-rgb: 224,166,42;
    --white: #ffffff; --light: #f7fbff; --muted: #6b7280;
    --text: #0a0a0a; --surface: #ffffff;
    --border: rgba(0,0,0,0.06);
    --healthy: #16a34a; --caution: #d97706; --critical: #dc2626;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --text-xs: 12px; --text-sm: 14px; --text-base: 16px;
    --text-lg: 20px; --text-xl: 24px; --text-2xl: 32px;
    --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
    --space-xs: 4px; --space-sm: 8px; --space-md: 16px;
    --space-lg: 24px; --space-xl: 32px; --space-2xl: 48px;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
    --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
  }
  body { font-family: var(--font); background: var(--light); color: var(--text); font-size: var(--text-base); line-height: 1.6; -webkit-font-smoothing: antialiased; }

  /* ── Header ── */
  .header { background: var(--navy); padding: var(--space-md) var(--space-xl); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header-left { display: flex; align-items: center; gap: var(--space-md); }
  .header-logo { height: 24px; width: auto; }
  .header h1 { color: var(--white); font-size: var(--text-lg); font-weight: 600; letter-spacing: -0.01em; }
  .header-right { display: flex; align-items: center; gap: var(--space-lg); }
  .header-score { display: flex; align-items: center; gap: var(--space-sm); background: rgba(255,255,255,0.08); padding: 6px 14px; border-radius: 20px; }
  .header-score .score-num { color: var(--gold); font-size: var(--text-lg); font-weight: 700; }
  .header-score .score-change { font-size: var(--text-xs); font-weight: 600; }
  .score-up { color: #4ade80; } .score-down { color: #f87171; } .score-flat { color: rgba(255,255,255,0.4); }
  .header-updated { color: rgba(255,255,255,0.4); font-size: var(--text-xs); }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,0.4); flex-shrink: 0; }
  .pulse.offline { background: #ef4444; box-shadow: 0 0 6px rgba(239,68,68,0.3); }

  /* ── Layout ── */
  .container { max-width: 900px; margin: 0 auto; padding: var(--space-xl) var(--space-lg); }

  /* ── Section ── */
  .section { margin-bottom: var(--space-2xl); }
  .section-header { display: flex; align-items: center; gap: var(--space-sm); margin-bottom: var(--space-md); }
  .section-header h2 { font-size: var(--text-sm); font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .section-header .line { flex: 1; height: 1px; background: var(--border); }

  /* ── Atlas's Brief ── */
  .brief-card { background: var(--surface); border-radius: var(--radius-lg); padding: var(--space-xl); box-shadow: var(--shadow-sm); border: 1px solid var(--border); border-left: 3px solid var(--navy); }
  .brief-greeting { font-size: var(--text-lg); font-weight: 700; color: var(--navy); margin-bottom: var(--space-sm); }
  .brief-body { font-size: var(--text-base); color: var(--text); line-height: 1.8; }
  .brief-footer { margin-top: var(--space-md); padding-top: var(--space-md); border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: var(--text-xs); color: var(--muted); }
  .brief-time { display: flex; align-items: center; gap: var(--space-xs); }

  /* ── Business Health ── */
  .health-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-md); }
  @media (max-width: 700px) { .health-grid { grid-template-columns: repeat(2, 1fr); } }
  .health-card { background: var(--surface); border-radius: var(--radius-md); padding: var(--space-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--border); display: flex; align-items: flex-start; gap: var(--space-md); }
  .health-icon { font-size: 24px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); background: var(--light); flex-shrink: 0; }
  .health-body { flex: 1; min-width: 0; }
  .health-body .health-name { font-weight: 600; font-size: var(--text-sm); color: var(--navy); display: flex; align-items: center; gap: var(--space-sm); }
  .health-body .health-detail { font-size: var(--text-xs); color: var(--muted); margin-top: 2px; line-height: 1.4; }
  .health-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-healthy { background: var(--healthy); box-shadow: 0 0 6px rgba(22,163,74,0.3); }
  .dot-caution { background: var(--caution); box-shadow: 0 0 6px rgba(217,119,6,0.3); }
  .dot-critical { background: var(--critical); box-shadow: 0 0 6px rgba(220,38,38,0.3); }

  /* ── Waiting For James ── */
  .waiting-list { display: flex; flex-direction: column; gap: var(--space-sm); }
  .waiting-item { background: var(--surface); border-radius: var(--radius-md); padding: var(--space-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--border); transition: box-shadow 0.15s; }
  .waiting-item:hover { box-shadow: var(--shadow-md); }
  .waiting-item.high-impact { border-left: 3px solid var(--gold); }
  .waiting-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-md); margin-bottom: var(--space-sm); }
  .waiting-top h3 { font-size: var(--text-base); font-weight: 600; color: var(--navy); }
  .waiting-impact { font-size: var(--text-xs); font-weight: 600; padding: 2px 10px; border-radius: 12px; white-space: nowrap; }
  .impact-high { background: rgba(224,166,42,0.12); color: #b8860b; }
  .impact-medium { background: rgba(107,114,128,0.1); color: var(--muted); }
  .impact-low { background: rgba(107,114,128,0.05); color: var(--muted); }
  .waiting-meta { display: flex; gap: var(--space-lg); font-size: var(--text-xs); color: var(--muted); margin-top: var(--space-sm); flex-wrap: wrap; }
  .waiting-recommendation { margin-top: var(--space-sm); font-size: var(--text-sm); color: var(--text); padding: var(--space-sm) var(--space-md); background: var(--light); border-radius: var(--radius-sm); }

  /* ── Atlas's Recommendation ── */
  .rec-card { background: var(--surface); border-radius: var(--radius-lg); padding: var(--space-xl); box-shadow: var(--shadow-sm); border: 1px solid var(--border); border-left: 3px solid var(--gold); }
  .rec-summary { font-size: var(--text-base); line-height: 1.7; margin-bottom: var(--space-xl); color: var(--text); }
  .rec-priority { margin-bottom: var(--space-lg); padding-bottom: var(--space-lg); border-bottom: 1px solid var(--border); }
  .rec-priority:last-of-type { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  .rec-priority .rec-num { font-size: var(--text-xs); font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: var(--space-xs); }
  .rec-priority h3 { font-size: var(--text-base); font-weight: 600; color: var(--navy); margin-bottom: var(--space-sm); }
  .rec-priority p { font-size: var(--text-sm); color: var(--text); line-height: 1.6; margin-bottom: var(--space-sm); }
  .rec-meta { display: flex; gap: var(--space-xl); font-size: var(--text-xs); color: var(--muted); flex-wrap: wrap; }
  .rec-meta span { display: flex; align-items: center; gap: var(--space-xs); }
  .rec-confidence { font-weight: 600; }
  .conf-high { color: var(--healthy); } .conf-medium { color: var(--caution); } .conf-low { color: var(--critical); }
  .can-wait { margin-top: var(--space-xl); padding-top: var(--space-lg); border-top: 1px solid var(--border); }
  .can-wait h4 { font-size: var(--text-sm); font-weight: 600; color: var(--muted); margin-bottom: var(--space-sm); }
  .can-wait ul { list-style: none; padding: 0; }
  .can-wait li { font-size: var(--text-sm); color: var(--muted); padding: var(--space-xs) 0; padding-left: var(--space-lg); position: relative; }
  .can-wait li::before { content: '—'; position: absolute; left: 0; color: var(--muted); }
  .rec-closing { margin-top: var(--space-lg); font-size: var(--text-sm); color: var(--muted); font-style: italic; }

  /* ── What Changed ── */
  .changes-tabs { display: flex; gap: var(--space-xs); margin-bottom: var(--space-md); }
  .changes-tab { font-size: var(--text-xs); font-weight: 600; padding: 6px 16px; border-radius: 20px; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--muted); transition: all 0.15s; }
  .changes-tab.active { background: var(--navy); color: var(--white); border-color: var(--navy); }
  .changes-list { display: flex; flex-direction: column; }
  .change-item { display: flex; gap: var(--space-md); padding: var(--space-sm) 0; font-size: var(--text-sm); border-bottom: 1px solid var(--border); }
  .change-item:last-child { border-bottom: none; }
  .change-time { color: var(--muted); font-size: var(--text-xs); min-width: 80px; flex-shrink: 0; }
  .change-desc { flex: 1; }

  /* ── Empty states ── */
  .empty-state { text-align: center; padding: var(--space-xl); color: var(--muted); font-size: var(--text-sm); }

  /* ── Secondary nav ── */
  .secondary-links { display: flex; gap: var(--space-md); flex-wrap: wrap; margin-top: var(--space-xl); padding-top: var(--space-xl); border-top: 1px solid var(--border); }
  .secondary-links a { color: var(--muted); text-decoration: none; font-size: var(--text-sm); padding: var(--space-xs) var(--space-sm); border-radius: var(--radius-sm); transition: all 0.15s; }
  .secondary-links a:hover { color: var(--navy); background: rgba(11,44,77,0.04); }

  /* ── Founder Call Day ── */
  .callday-header { background: linear-gradient(135deg, var(--navy), #153e6b); color: var(--white); border-radius: var(--radius-lg); padding: var(--space-lg) var(--space-xl); margin-bottom: var(--space-md); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--space-md); }
  .callday-header h2 { font-size: var(--text-lg); font-weight: 700; color: var(--gold); }
  .callday-header .callday-meta { font-size: var(--text-sm); opacity: 0.8; }
  .callday-card { background: var(--surface); border-radius: var(--radius-md); margin-bottom: var(--space-sm); box-shadow: var(--shadow-sm); border: 1px solid var(--border); overflow: hidden; transition: border-color 0.15s; }
  .callday-card:hover { border-color: var(--gold); }
  .callday-card.called { opacity: 0.6; }
  .callday-card-header { display: flex; align-items: center; gap: var(--space-md); padding: var(--space-md) var(--space-lg); cursor: pointer; user-select: none; }
  .callday-card-header .call-num { font-size: var(--text-lg); font-weight: 700; color: var(--gold); min-width: 32px; text-align: center; }
  .callday-card-header .call-info { flex: 1; min-width: 0; }
  .callday-card-header .call-name { font-weight: 600; font-size: var(--text-base); color: var(--navy); }
  .callday-card-header .call-contact { font-size: var(--text-sm); color: var(--muted); }
  .callday-card-header .call-phone { font-weight: 700; font-size: var(--text-lg); color: var(--navy); white-space: nowrap; display: flex; align-items: center; gap: var(--space-sm); }
  .callday-card-header .call-phone a { color: var(--navy); text-decoration: none; }
  .callday-card-header .call-chevron { font-size: var(--text-sm); color: var(--muted); transition: transform 0.2s; }
  .callday-card.expanded .call-chevron { transform: rotate(180deg); }
  .callday-card-body { display: none; padding: 0 var(--space-lg) var(--space-lg); border-top: 1px solid var(--border); }
  .callday-card.expanded .callday-card-body { display: block; }
  .callday-brief { font-size: var(--text-sm); line-height: 1.7; margin-bottom: var(--space-md); color: var(--text); }
  .callday-brief .fact { color: var(--healthy); font-weight: 600; font-size: var(--text-xs); }
  .callday-brief .inference { color: var(--caution); font-weight: 600; font-size: var(--text-xs); }
  .callday-section-label { font-size: var(--text-xs); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: var(--space-md); margin-bottom: var(--space-xs); }
  .callday-opening { background: var(--light); padding: var(--space-md); border-radius: var(--radius-sm); font-size: var(--text-sm); line-height: 1.6; margin-bottom: var(--space-sm); border-left: 3px solid var(--gold); }
  .callday-discovery { font-size: var(--text-sm); color: var(--text); margin-bottom: var(--space-sm); }
  .callday-discovery li { margin-bottom: var(--space-xs); }
  .callday-actions { display: flex; gap: var(--space-sm); flex-wrap: wrap; margin-top: var(--space-md); }
  .callday-btn { padding: 8px 18px; border-radius: 20px; font-size: var(--text-xs); font-weight: 600; border: 1px solid var(--border); background: var(--surface); color: var(--navy); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .callday-btn:hover { background: var(--navy); color: var(--white); border-color: var(--navy); }
  .callday-btn.called-btn { background: var(--healthy); color: var(--white); border-color: var(--healthy); }
  .callday-btn.voicemail-btn { background: var(--caution); color: var(--white); border-color: var(--caution); }
  .callday-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 12px; white-space: nowrap; }
  .badge-high { background: rgba(22,163,74,0.1); color: var(--healthy); }
  .badge-medium { background: rgba(217,119,6,0.1); color: var(--caution); }
  .badge-low { background: rgba(107,114,128,0.1); color: var(--muted); }
  .callday-issues { font-size: var(--text-xs); color: var(--muted); margin-top: var(--space-lg); padding: var(--space-md); background: var(--light); border-radius: var(--radius-sm); }
  @media (max-width: 600px) {
    .callday-card-header { flex-wrap: wrap; }
    .callday-card-header .call-phone { width: 100%; justify-content: flex-start; }
    .callday-actions { flex-direction: column; }
  }

  /* ── Founder Outreach Execution Surface ── */
  .fod-priority { background: linear-gradient(135deg, #0b2c4d, #153e6b); color: #fff; border-radius: var(--radius-lg); padding: var(--space-lg) var(--space-xl); margin-bottom: var(--space-md); border-left: 4px solid var(--gold); }
  .fod-priority .fod-eyebrow { font-size: var(--text-xs); font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 0.08em; }
  .fod-priority .fod-headline { font-size: var(--text-xl); font-weight: 700; margin: var(--space-xs) 0; }
  .fod-priority .fod-obj { font-size: var(--text-sm); opacity: 0.92; line-height: 1.6; }
  .fod-priority .fod-progression { margin-top: var(--space-sm); font-size: var(--text-sm); font-weight: 600; color: var(--gold); }
  .fod-milestones { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-sm); margin-bottom: var(--space-md); }
  .fod-milestone { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-md); text-align: center; box-shadow: var(--shadow-sm); }
  .fod-milestone .mil-label { font-size: var(--text-xs); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
  .fod-milestone .mil-value { font-size: var(--text-lg); font-weight: 700; color: var(--navy); margin-top: 2px; }
  .fod-milestone .mil-target { font-size: var(--text-xs); color: var(--muted); }
  .fod-qpaint { display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); background: #eef7ee; border: 1px solid rgba(22,163,74,0.25); border-radius: var(--radius-md); padding: var(--space-sm) var(--space-md); margin-bottom: var(--space-md); flex-wrap: wrap; }
  .fod-qpaint .q-left { display: flex; align-items: center; gap: var(--space-sm); }
  .fod-qpaint .q-status { font-size: var(--text-sm); font-weight: 700; color: var(--healthy); }
  .fod-qpaint .q-actions { font-size: var(--text-xs); color: var(--muted); }
  .fod-scoreboard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-md) var(--space-lg); margin-bottom: var(--space-md); box-shadow: var(--shadow-sm); }
  .fod-scoreboard .sb-title { font-size: var(--text-xs); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: var(--space-sm); }
  .fod-scoreboard .sb-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-sm); }
  .fod-scoreboard .sb-item { text-align: center; padding: var(--space-xs); }
  .fod-scoreboard .sb-num { font-size: var(--text-lg); font-weight: 700; color: var(--navy); }
  .fod-scoreboard .sb-label { font-size: var(--text-xs); color: var(--muted); line-height: 1.3; }
  .call-group-label { font-size: var(--text-sm); font-weight: 700; color: var(--navy); margin: var(--space-lg) 0 var(--space-sm); display: flex; align-items: center; gap: var(--space-sm); }
  .call-group-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .call-now { border: 2px solid var(--gold); }
  .call-now .callday-card-header { background: #fffaf0; }
  .fod-field { display: flex; gap: var(--space-sm); font-size: var(--text-sm); margin-bottom: var(--space-xs); line-height: 1.55; }
  .fod-field .fod-key { font-weight: 700; color: var(--navy); min-width: 132px; flex-shrink: 0; font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.03em; padding-top: 2px; }
  .fod-field .fod-val { color: var(--text); flex: 1; }
  .fod-field .fod-val .fact { color: var(--healthy); font-weight: 600; }
  .fod-field .fod-val .inference { color: var(--caution); font-weight: 600; }
  @media (max-width: 700px) { .fod-milestones { grid-template-columns: 1fr; } .fod-scoreboard .sb-grid { grid-template-columns: repeat(2, 1fr); } .fod-field { flex-direction: column; gap: 0; } .fod-field .fod-key { min-width: auto; } }

  /* ── Loading ── */
  .loading { text-align: center; padding: var(--space-3xl); color: var(--muted); }
  .loading-spinner { display: inline-block; width: 24px; height: 24px; border: 2px solid var(--border); border-top: 2px solid var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: var(--space-md); }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- ── Header ── -->
<div class="header">
  <div class="header-left">
    <img src="../assets/favicon.png" alt="NF" class="header-logo">
    <h1>Headquarters</h1>
  </div>
  <div class="header-right">
    <div class="header-score" id="score-badge">
      <span class="score-num" id="score-num">—</span>
      <span class="score-change" id="score-change"></span>
    </div>
    <span class="pulse" id="pulse"></span>
    <span class="header-updated" id="updated">Loading…</span>
  </div>
</div>

<div class="container" id="app">
  <div class="loading">
    <div class="loading-spinner"></div>
    <div>Loading Headquarters…</div>
  </div>
</div>

<!-- ── Script ── -->
<script>
let H = null;  // headquarters data
let D = null;  // raw dash data

async function load() {
  try {
    const [hr, dr] = await Promise.all([
      fetch('headquarters-data.json?' + Date.now()),
      fetch('dash.json?' + Date.now())
    ]);
    H = await hr.json();
    D = await dr.json();
  } catch(e) {
    H = null; D = null;
  }
  render();
}

function ago(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const now = new Date();
  const min = Math.floor((now - d) / 60000);
  if (min < 1) return 'just now';
  if (min < 60) return min + 'm ago';
  const hrs = Math.floor(min / 60);
  if (hrs < 24) return hrs + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function healthDot(status) {
  const cls = status === 'healthy' ? 'dot-healthy' : status === 'caution' ? 'dot-caution' : 'dot-critical';
  return '<span class="health-dot ' + cls + '"></span>';
}

function statusLabel(status) {
  if (status === 'healthy') return 'Healthy';
  if (status === 'caution') return 'Needs attention';
  return 'Critical';
}

function callCard(c, i, outcomes, extraClass) {
  const confClass = (c.confidence||'').toLowerCase().includes('high') ? 'badge-high' :
                    (c.confidence||'').toLowerCase().includes('medium') ? 'badge-medium' : 'badge-low';
  let h = '<div class="callday-card ' + (extraClass||'') + '" id="call-' + i + '">';
  h += '<div class="callday-card-header" onclick="toggleCall(' + i + ')">';
  h += '<span class="call-num">' + i + '</span>';
  h += '<div class="call-info">';
  h += '<div class="call-name">' + esc(c.business) + ' <span class="callday-badge ' + confClass + '">' + esc(c.priority || c.confidence || '') + '</span></div>';
  h += '<div class="call-contact">' + esc(c.contact || '—') + ' · ' + esc(c.role || '') + ' · ' + esc(c.location || '') + '</div>';

  h += '<div class="call-phone"><a href="tel:' + esc(c.phone || '').replace(/[^0-9+]/g,'') + '">' + esc(c.phone || '?') + '</a></div>';

  h += '</div>';
  h += '<div class="callday-card-body">';
  if (c.why_now) h += '<div class="fod-field"><div class="fod-key">Why now</div><div class="fod-val">' + esc(c.why_now) + '</div></div>';
  if (c.what_happened) h += '<div class="fod-field"><div class="fod-key">What happened</div><div class="fod-val">' + esc(c.what_happened) + '</div></div>';
  if (c.what_we_know) h += '<div class="fod-field"><div class="fod-key">We know</div><div class="fod-val">' + esc(c.what_we_know) + '</div></div>';
  if (c.objective) h += '<div class="fod-field"><div class="fod-key">Objective</div><div class="fod-val">' + esc(c.objective) + '</div></div>';
  if (c.opening) { h += '<div class="callday-section-label">Opening context</div><div class="callday-opening">' + esc(c.opening) + '</div>'; }
  if (c.discovery && c.discovery.length > 0) {
    h += '<div class="callday-section-label">Discover</div><ul class="callday-discovery">';
    c.discovery.forEach(q => { h += '<li>' + esc(q) + '</li>'; });
    h += '</ul>';
  }
  if (c.next_step) h += '<div class="fod-field"><div class="fod-key">Next step</div><div class="fod-val">' + esc(c.next_step) + '</div></div>';
  if (c.not_assume) h += '<div class="fod-field"><div class="fod-key">Do NOT assume</div><div class="fod-val"><span class="inference">' + esc(c.not_assume) + '</span></div></div>';
  if (c.last_contact) h += '<div class="fod-field"><div class="fod-key">Last contact</div><div class="fod-val">' + esc(c.last_contact) + '</div></div>';
  if (c.crm_state) h += '<div class="fod-field"><div class="fod-key">CRM state</div><div class="fod-val">' + esc(c.crm_state) + '</div></div>';
  h += '<div class="callday-section-label">Call outcome</div><div class="callday-actions">';
  (outcomes || []).forEach(o => { h += '<button class="callday-btn" onclick="recordOutcome(' + i + ',\'' + esc(o) + '\');event.stopPropagation();">' + esc(o) + '</button>'; });
  h += '</div></div></div>';
  return h;
}

function showChanges(key) {
  // Update tabs
  document.querySelectorAll('.changes-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.changes-tab').forEach(t => {
    if (t.textContent.toLowerCase().replace(' ', '_') === key || 
        (key === 'this_week' && t.textContent === 'This Week')) {
      t.classList.add('active');
    }
  });
  // Fallback: find by onclick
  const tabs = document.querySelectorAll('.changes-tab');
  const map = {'today': 0, 'yesterday': 1, 'this_week': 2};
  if (map[key] !== undefined && tabs[map[key]]) tabs[map[key]].classList.add('active');

  // Show/hide change lists
  ['today', 'yesterday', 'this_week'].forEach(k => {
    const el = document.getElementById('changes-' + k);
    if (el) el.style.display = k === key ? 'block' : 'none';
  });
}

function esc(s) {
  if (!s) return '';
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function toggleCall(n) {
  const card = document.getElementById('call-' + n);
  if (card) card.classList.toggle('expanded');
}

function recordOutcome(n, outcome) {
  const card = document.getElementById('call-' + n);
  if (!card) return;
  // Mark as called
  card.classList.add('called');
  // Collapse
  card.classList.remove('expanded');
  // Store outcome
  const store = JSON.parse(localStorage.getItem('callday_outcomes') || '{}');
  store['call-' + n] = { outcome: outcome, time: new Date().toISOString() };
  localStorage.setItem('callday_outcomes', JSON.stringify(store));
  // Visual feedback
  const header = card.querySelector('.call-name');
  if (header) header.textContent += ' — ' + outcome;
  // Remove outcome buttons
  const actions = card.querySelector('.callday-actions');
  if (actions) actions.innerHTML = '<span style=\"font-size:var(--text-xs);color:var(--muted);\">✓ Recorded: ' + outcome + '</span>';
}

// Restore saved outcomes on load
function restoreOutcomes() {
  const store = JSON.parse(localStorage.getItem('callday_outcomes') || '{}');
  for (const [key, val] of Object.entries(store)) {
    const n = key.replace('call-', '');
    const card = document.getElementById('call-' + n);
    if (card) {
      card.classList.add('called');
      const header = card.querySelector('.call-name');
      if (header) header.textContent += ' — ' + val.outcome;
      const actions = card.querySelector('.callday-actions');
      if (actions) actions.innerHTML = '<span style=\"font-size:var(--text-xs);color:var(--muted);\">✓ Recorded: ' + val.outcome + '</span>';
    }
  }
}

// Boot
load();
// Refresh every 5 minutes
setInterval(load, 300000);

// Force fresh load: if page was cached before this version, hard reload
(function(){
  var currentVersion = '2026-09-02-founder-outreach';
  var storedVersion = sessionStorage.getItem('hq_version');
  if (storedVersion && storedVersion !== currentVersion) {
    sessionStorage.setItem('hq_version', currentVersion);
    location.reload(true);
  } else {
    sessionStorage.setItem('hq_version', currentVersion);
  }
})();
</script>
